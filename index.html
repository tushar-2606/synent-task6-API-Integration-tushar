<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Profile Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1 class="title">GitHub Profile Finder</h1>

    <form id="search-form" class="search" aria-label="Search GitHub user">
      <input type="text" id="username" name="username" placeholder="Enter GitHub username" autocomplete="off">
      <button type="submit" id="search-btn">Search</button>
    </form>

    <section id="result" class="result" aria-live="polite"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
